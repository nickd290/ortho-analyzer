        // Learning System - stores corrections and improves over time
        class LearningSystem {
            constructor() {
                this.corrections = this.loadCorrections();
                this.patterns = this.loadPatterns();
            }

            loadCorrections() {
                const stored = localStorage.getItem('ortho_corrections');
                return stored ? JSON.parse(stored) : [];
            }

            loadPatterns() {
                const stored = localStorage.getItem('ortho_patterns');
                return stored ? JSON.parse(stored) : {
                    commonMisses: [],
                    accurateFindings: [],
                    diagnosticRules: []
                };
            }

            saveCorrections() {
                localStorage.setItem('ortho_corrections', JSON.stringify(this.corrections));
            }

            savePatterns() {
                localStorage.setItem('ortho_patterns', JSON.stringify(this.patterns));
            }

            addCorrection(original, corrected, category) {
                this.corrections.push({
                    timestamp: new Date().toISOString(),
                    original,
                    corrected,
                    category
                });
                this.saveCorrections();
                this.updatePatterns(original, corrected, category);
            }

            updatePatterns(original, corrected, category) {
                // Extract key differences
                const diff = {
                    category,
                    original: original.toLowerCase(),
                    corrected: corrected.toLowerCase(),
                    frequency: 1
                };

                // Check if similar correction exists
                const existing = this.patterns.commonMisses.find(p => 
                    p.category === category && 
                    p.original.includes(original.toLowerCase().substring(0, 20))
                );

                if (existing) {
                    existing.frequency++;
                } else {
                    this.patterns.commonMisses.push(diff);
                }

                this.savePatterns();
            }

            getInsights() {
                // Return top patterns to inform future analyses
                return {
                    topMisses: this.patterns.commonMisses
                        .sort((a, b) => b.frequency - a.frequency)
                        .slice(0, 10),
                    totalCorrections: this.corrections.length,
                    categories: [...new Set(this.corrections.map(c => c.category))]
                };
            }

            getContextualGuidance() {
                const insights = this.getInsights();
                if (insights.totalCorrections === 0) return '';

                let guidance = '\n\nBASED ON PREVIOUS CORRECTIONS:\n';
                insights.topMisses.forEach((miss, idx) => {
                    guidance += `${idx + 1}. When you see "${miss.original.substring(0, 50)}", verify it's not actually "${miss.corrected.substring(0, 50)}" (corrected ${miss.frequency}x)\n`;
                });

                return guidance;
            }
        }

SYSTEMATIC ANALYSIS PROTOCOL:

STEP 1: IMAGE IDENTIFICATION

- Panoramic radiograph (Panorex)
- Lateral cephalometric radiograph
- Cephalometric tracing (if present)
- Frontal intraoral (center bite)
- Right buccal intraoral
- Left buccal intraoral
- Upper occlusal (maxillary arch view)
- Lower occlusal (mandibular arch view)
- Frontal extraoral (face, smile)
- Frontal extraoral (face, repose)
- Profile extraoral (lateral face)

STEP 2: RADIOGRAPHIC ANALYSIS (if Panorex/Ceph available)

PANORAMIC ASSESSMENT:
- Dentition status: Identify ALL present teeth by tooth number
- Missing teeth: Note congenitally missing, extracted, or unerupted
- Impacted teeth: Location and angulation
- Third molars: Present, position, development stage
- Root morphology: Parallelism, dilacerations, root resorption
- Bone levels: Assess alveolar bone height
- Pathology: Caries, bone loss, radiolucencies, root resorption

CEPHALOMETRIC ASSESSMENT (if available):
- Skeletal Pattern:
  * SNA angle (maxillary position): Normal 82° ±2°
  * SNB angle (mandibular position): Normal 80° ±2°

- Vertical Relationships:
  * Mandibular plane angle: High (steep), Average, Low (flat)
  * Facial height proportions
- Dental Relationships:
  * Upper incisor to NA: Linear and angular
  * Lower incisor to NB: Linear and angular
  * Interincisal angle
  * Upper incisor to maxillary plane
- Soft Tissue:
  * Nasolabial angle
  * Upper lip to E-plane
  * Lower lip to E-plane
  * Facial convexity

STEP 3: DENTAL OCCLUSION ANALYSIS

MOLAR RELATIONSHIP (measure precisely):
- RIGHT SIDE: Class I / II (specify end-to-end, cusp-to-cusp, or full cusp) / III
- LEFT SIDE: Class I / II (specify end-to-end, cusp-to-cusp, or full cusp) / III
- Asymmetry: Note if different on each side

CANINE RELATIONSHIP:
- RIGHT SIDE: Class I / II / III
- LEFT SIDE: Class I / II / III

OVERJET (horizontal):
- Measure in mm: Normal is 2-3mm
- Note if increased (>3mm) or reversed (negative overjet/anterior crossbite)

OVERBITE (vertical):
- Measure in mm or percentage of lower incisor coverage
- Normal: 2-3mm or ~30% coverage
- Deep bite: >3mm or >50%
- Open bite: Negative overbite, specify amount of opening

CROSSBITES:
- Anterior crossbite: Which teeth, skeletal vs dental
- Posterior crossbite: Which teeth, unilateral or bilateral, buccal vs lingual

STEP 4: CROWDING & SPACING ANALYSIS

UPPER ARCH:
- Severity: None / Mild (<4mm) / Moderate (4-8mm) / Severe (>8mm) / Spacing
- Location: Anterior, posterior, or generalized
- Specific areas of concern

LOWER ARCH:
- Severity: None / Mild (<4mm) / Moderate (4-8mm) / Severe (>8mm) / Spacing
- Location: Anterior, posterior, or generalized
- Specific teeth involved

STEP 5: ARCH FORM & SYMMETRY

- Arch coordination: Upper and lower arch width compatibility
- Arch symmetry: Right vs left side comparison
- Arch length: Adequate or deficient
- Tooth size discrepancy: Bolton analysis if apparent

STEP 6: MIDLINE ANALYSIS

- Upper dental midline: Relationship to facial midline (mm right or left)
- Lower dental midline: Relationship to facial midline (mm right or left)
- Inter-arch discrepancy: Upper to lower midline (mm)

STEP 7: PROFILE & SOFT TISSUE ANALYSIS

PROFILE:
- Convex / Straight / Concave
- Lip competence: Competent / Incompetent (measure interlabial gap if present)
- Nasolabial angle: Acute / Normal / Obtuse
- Mentolabial fold: Deep / Normal / Shallow
- Chin position: Retrusive / Normal / Prominent

SMILE ANALYSIS:
- Tooth display at smile: Amount of maxillary incisor show
- Gingival display: None / Minimal / Moderate / Excessive (gummy smile)
- Smile arc: Consonant / Flat / Reverse
- Buccal corridors: Narrow / Normal / Wide
- Dental midline at smile: Centered or deviated

STEP 8: ADDITIONAL FINDINGS

- Tooth wear/attrition
- Gingival health and contours
- Periodontal concerns
- Restorations present
- Tooth morphology anomalies
- Functional concerns (TMJ, bruxism indicators)

            const analyzeCase = async () => {
                if (!apiKey) {
                    alert('Please enter your Anthropic API key first');
                    setShowApiKeyInput(true);
                    return;
                }

                setAnalyzing(true);
                
                try {
                    const imageContent = images.map(img => ({
                        type: "image",
                        source: {
                            type: "base64",
                            media_type: img.type,
                            data: img.data
                        }
                    }));

                    const prompt = generateSophisticatedPrompt();

                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-api-key": apiKey,
                            "anthropic-version": "2023-06-01"
                        },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 8000,
                            temperature: 0.3,
                            messages: [
                                {
                                    role: "user",
                                    content: [
                                        ...imageContent,
                                        {
                                            type: "text",
                                            text: prompt
                                        }
                                    ]
                                }
                            ]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || 'API request failed');
                    }

                    const data = await response.json();
                    const analysisText = data.content[0].text;
                    
                    setAnalysis(analysisText);
                    setEditableAnalysis(analysisText);
                    setStep(3);
                } catch (error) {
                    console.error("Error analyzing case:", error);
                    alert(`Error analyzing case: ${error.message}`);
                } finally {
                    setAnalyzing(false);
                }
            };

            const approveAnalysis = () => {
                // Check what was changed
                if (editableAnalysis !== analysis) {
                    // User made corrections - record them for learning
                    const categories = extractCategories(analysis, editableAnalysis);
                    categories.forEach(cat => {
                        learningSystem.addCorrection(cat.original, cat.corrected, cat.category);
                    });
                }
                setAnalysis(editableAnalysis);
                setShowFeedback(true);
            };

            const extractCategories = (original, corrected) => {
                // Simple extraction of what changed - in practice, this could be more sophisticated
                const categories = [];
                const sections = [
                    'CHIEF COMPLAINTS',
                    'RADIOGRAPHIC ANALYSIS',
                    'DENTAL OCCLUSION',
                    'CROWDING & SPACING',
                    'MIDLINE ASSESSMENT',
                    'DIAGNOSIS'
                ];

                sections.forEach(section => {
                    const origSection = extractSection(original, section);
                    const corrSection = extractSection(corrected, section);
                    if (origSection !== corrSection) {
                        categories.push({
                            category: section,
                            original: origSection,
                            corrected: corrSection
                        });
                    }
                });

                return categories;
            };

            const extractSection = (text, sectionName) => {
                const regex = new RegExp(`${sectionName}[\\s\\S]*?(?=\\n[A-Z][A-Z]|$)`, 'i');
                const match = text.match(regex);
                return match ? match[0] : '';

Be extremely specific and actionable in your recommendations. This treatment plan should be comprehensive enough to guide the entire treatment process.`;

                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-api-key": apiKey,
                            "anthropic-version": "2023-06-01"
                        },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 8000,
                            temperature: 0.3,
                            messages: [
                                {
                                    role: "user",
                                    content: prompt
                                }
                            ]
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to generate treatment plan');
                    }

                    const data = await response.json();
                    const planText = data.content[0].text;
                    
                    setTreatmentPlan(planText);
                    setEditableTreatmentPlan(planText);
                    setStep(4);
                } catch (error) {
                    console.error("Error generating treatment plan:", error);
                    alert("Error generating treatment plan. Please try again.");
                } finally {
                    setAnalyzing(false);
                }
            };

            const approveTreatmentPlan = () => {
                if (editableTreatmentPlan !== treatmentPlan) {
                    // Record corrections
                    learningSystem.addCorrection(
                        treatmentPlan.substring(0, 200),
                        editableTreatmentPlan.substring(0, 200),
                        'TREATMENT_PLAN'
                    );
                }
                setTreatmentPlan(editableTreatmentPlan);
                setStep(5);
            };

            const calculateAge = (dob) => {
                if (!dob) return 'N/A';
                const today = new Date();
                const birthDate = new Date(dob);
                let age = today.getFullYear() - birthDate.getFullYear();
                const monthDiff = today.getMonth() - birthDate.getMonth();
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                return age;
            };

            const downloadReport = () => {
                const reportContent = `
ORTHODONTIC CASE ANALYSIS & TREATMENT PLAN
==========================================

Generated: ${new Date().toISOString()}

${editableAnalysis}

${editableTreatmentPlan || ''}

---
Generated by Orthodontic Case Analyzer Pro
Learning System: ${learningSystem.getInsights().totalCorrections} cases analyzed
`;

                const blob = new Blob([reportContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${patientInfo.name.replace(/\s+/g, '_')}_Complete_Report_${patientInfo.date}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const resetApp = () => {
                setStep(1);
                setPatientInfo({
                    name: '',
                    id: '',
                    dob: '',
                    recordType: 'initial',
                    date: new Date().toISOString().split('T')[0]
                });
                setImages([]);
                setAnalysis(null);
                setEditableAnalysis(null);
                setTreatmentPlan(null);
                setEditableTreatmentPlan(null);
                setShowFeedback(false);
            };

            const insights = learningSystem.getInsights();

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
                    {/* API Key Modal */}
                    {showApiKeyInput && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
                                <h2 className="text-2xl font-bold text-gray-900 mb-4">
                                    Enter Anthropic API Key
                                </h2>
                                <p className="text-gray-600 mb-6">
                                    Your API key is stored locally and never sent anywhere except Anthropic's API.
                                </p>
                                <input
                                    type="password"
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    placeholder="sk-ant-api..."
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4"
                                />
                                <div className="text-sm text-gray-500 mb-4">
                                    Get your API key from{' '}
                                    <a href="https://console.anthropic.com/" target="_blank" className="text-indigo-600 hover:underline">
                                        console.anthropic.com
                                    </a>
                                </div>
                                <button
                                    onClick={() => saveApiKey(apiKey)}
                                    disabled={!apiKey.startsWith('sk-ant-')}
                                    className="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed"
                                >
                                    Save & Continue
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="container mx-auto px-4 py-8">
                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div className="flex items-center justify-between">
                                <div>
                                    <div className="flex items-center gap-3">
                                        <h1 className="text-3xl font-bold text-indigo-900">
                                            Orthodontic Case Analyzer Pro
                                        </h1>
                                        <span className="px-3 py-1 bg-green-100 text-green-800 text-sm font-semibold rounded-full">
                                            AI Learning Enabled
                                        </span>
                                    </div>
                                    <p className="text-gray-600 mt-1">
                                        Advanced Clinical Analysis with Machine Learning
                                    </p>
                                    {insights.totalCorrections > 0 && (
                                        <p className="text-sm text-indigo-600 mt-2">
                                            🧠 Learning from {insights.totalCorrections} previous corrections
                                        </p>
                                    )}
                                </div>
                                <div className="flex gap-2">
                                    {apiKey && (
                                        <button
                                            onClick={clearApiKey}
                                            className="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition text-sm"
                                        >
                                            Clear API Key
                                        </button>
                                    )}
                                    {step > 1 && (
                                        <button
                                            onClick={resetApp}
                                            className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition"
                                        >
                                            New Case
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Progress Steps */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div className="flex items-center justify-between">
                                {[
                                    { num: 1, label: 'Patient Info' },
                                    { num: 2, label: 'Upload Images' },
                                    { num: 3, label: 'Review Analysis' },
                                    { num: 4, label: 'Review Treatment Plan' },
                                    { num: 5, label: 'Complete' }
                                ].map((s, idx) => (
                                    <React.Fragment key={s.num}>
                                        <div className="flex flex-col items-center">
                                            <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold ${
                                                step >= s.num ? 'bg-indigo-600 text-white' : 'bg-gray-300 text-gray-600'
                                            }`}>
                                                {s.num}
                                            </div>
                                            <span className="text-sm mt-2 text-center">{s.label}</span>
                                        </div>
                                        {idx < 4 && (
                                            <div className={`flex-1 h-1 mx-4 ${
                                                step > s.num ? 'bg-indigo-600' : 'bg-gray-300'
                                            }`} />
                                        )}
                                    </React.Fragment>
                                ))}
                            </div>
                        </div>

                        {/* Step 1: Patient Information */}
                        {step === 1 && (
                            <div className="bg-white rounded-lg shadow-lg p-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-6">Patient Information</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Patient Name *
                                        </label>
                                        <input
                                            type="text"
                                            value={patientInfo.name}
                                            onChange={(e) => handlePatientInfoChange('name', e.target.value)}
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            placeholder="John Doe"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Patient ID *
                                            </label>
                                            <input
                                                type="text"
                                                value={patientInfo.id}
                                                onChange={(e) => handlePatientInfoChange('id', e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                                placeholder="P-12345"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Date of Birth *
                                            </label>
                                            <input
                                                type="date"
                                                value={patientInfo.dob}
                                                onChange={(e) => handlePatientInfoChange('dob', e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Record Type *
                                            </label>
                                            <select
                                                value={patientInfo.recordType}
                                                onChange={(e) => handlePatientInfoChange('recordType', e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            >
                                                <option value="initial">Initial Records</option>
                                                <option value="progress">Progress Records</option>
                                                <option value="final">Final Records</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Record Date *
                                            </label>
                                            <input
                                                type="date"
                                                value={patientInfo.date}
                                                onChange={(e) => handlePatientInfoChange('date', e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <button
                                    onClick={() => setStep(2)}
                                    disabled={!patientInfo.name || !patientInfo.id || !patientInfo.dob}
                                    className="mt-8 w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed"
                                >
                                    Continue to Image Upload
                                </button>
                            </div>
                        )}

                        {/* Step 2: Image Upload */}
                        {step === 2 && (
                            <div className="bg-white rounded-lg shadow-lg p-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-6">Upload Orthodontic Images</h2>
                                
                                <div className="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-6">
                                    <input
                                        type="file"
                                        accept="image/*"
                                        multiple
                                        onChange={handleImageUpload}
                                        className="hidden"
                                        id="image-upload"
                                    />
                                    <label htmlFor="image-upload" className="cursor-pointer">
                                        <div className="text-6xl mb-4">📸</div>
                                        <p className="text-lg font-medium text-gray-700 mb-2">
                                            Click to upload images or drag and drop
                                        </p>
                                        <p className="text-sm text-gray-500">
                                            Upload panoramic, cephalometric, intraoral, and extraoral photos
                                        </p>
                                    </label>
                                </div>

                                {images.length > 0 && (
                                    <div className="mb-6">
                                        <h3 className="font-semibold text-lg mb-3">
                                            Uploaded Images ({images.length})
                                        </h3>
                                        <div className="grid grid-cols-4 gap-4">
                                            {images.map((img, idx) => (
                                                <div key={idx} className="relative group">
                                                    <img
                                                        src={`data:${img.type};base64,${img.data}`}
                                                        alt={img.name}
                                                        className="w-full h-32 object-cover rounded-lg border-2 border-gray-200"
                                                    />
                                                    <button
                                                        onClick={() => removeImage(idx)}
                                                        className="absolute top-2 right-2 bg-red-500 text-white w-6 h-6 rounded-full opacity-0 group-hover:opacity-100 transition"
                                                    >
                                                        ×
                                                    </button>
                                                    <p className="text-xs mt-1 truncate">{img.name}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="flex gap-4">
                                    <button
                                        onClick={() => setStep(1)}
                                        className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition"
                                    >
                                        Back
                                    </button>
                                    <button
                                        onClick={analyzeCase}
                                        disabled={images.length === 0 || analyzing}
                                        className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed"
                                    >
                                        {analyzing ? 'Analyzing with AI...' : 'Analyze Case with AI'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Step 3: Review & Approve Analysis */}
                        {step === 3 && editableAnalysis && (
                            <div className="bg-white rounded-lg shadow-lg p-8">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold text-gray-900">Review & Approve Analysis</h2>
                                    <span className="px-3 py-1 bg-yellow-100 text-yellow-800 text-sm font-semibold rounded-full">
                                        Awaiting Your Approval
                                    </span>
                                </div>
                                
                                <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
                                    <p className="text-sm text-yellow-800">
                                        <strong>Review carefully:</strong> Edit any incorrect findings below. Your corrections help the AI learn and improve accuracy on future cases.
                                    </p>
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Case Analysis (Editable)
                                    </label>
                                    <textarea
                                        value={editableAnalysis}
                                        onChange={(e) => setEditableAnalysis(e.target.value)}
                                        className="w-full h-96 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono text-sm"
                                    />
                                </div>

                                <div className="flex gap-4">
                                    <button
                                        onClick={() => setStep(2)}
                                        className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition"
                                    >
                                        Back to Images
                                    </button>
                                    <button
                                        onClick={approveAnalysis}
                                        className="flex-2 bg-green-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-green-700 transition"
                                    >
                                        ✓ Approve Analysis
                                    </button>
                                    <button
                                        onClick={generateTreatmentPlan}
                                        disabled={analyzing}
                                        className="flex-2 bg-indigo-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:bg-gray-300"
                                    >
                                        {analyzing ? 'Generating...' : 'Generate Treatment Plan →'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Step 4: Review & Approve Treatment Plan */}
                        {step === 4 && editableTreatmentPlan && (
                            <div className="bg-white rounded-lg shadow-lg p-8">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold text-gray-900">Review & Approve Treatment Plan</h2>
                                    <span className="px-3 py-1 bg-yellow-100 text-yellow-800 text-sm font-semibold rounded-full">
                                        Awaiting Your Approval
                                    </span>
                                </div>
                                
                                <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
                                    <p className="text-sm text-yellow-800">
                                        <strong>Review carefully:</strong> Edit the treatment plan as needed. Your modifications help improve future treatment planning.
                                    </p>
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Treatment Plan (Editable)
                                    </label>
                                    <textarea
                                        value={editableTreatmentPlan}
                                        onChange={(e) => setEditableTreatmentPlan(e.target.value)}
                                        className="w-full h-96 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono text-sm"
                                    />
                                </div>

                                <div className="flex gap-4">
                                    <button
                                        onClick={() => setStep(3)}
                                        className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition"
                                    >
                                        Back to Analysis
                                    </button>
                                    <button
                                        onClick={approveTreatmentPlan}
                                        className="flex-2 bg-green-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-green-700 transition"
                                    >
                                        ✓ Approve Treatment Plan
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Step 5: Complete */}
                        {step === 5 && (
                            <div className="bg-white rounded-lg shadow-lg p-8">
                                <div className="text-center mb-8">
                                    <div className="text-6xl mb-4">✅</div>
                                    <h2 className="text-3xl font-bold text-gray-900 mb-2">
                                        Case Analysis Complete!
                                    </h2>
                                    <p className="text-gray-600">
                                        Your corrections have been recorded to improve future analyses
                                    </p>
                                </div>

                                <div className="bg-indigo-50 rounded-lg p-6 mb-6">
                                    <h3 className="font-semibold text-lg mb-3">Learning System Update</h3>
                                    <div className="grid grid-cols-3 gap-4 text-center">
                                        <div className="bg-white rounded-lg p-4">
                                            <div className="text-3xl font-bold text-indigo-600">
                                                {insights.totalCorrections + 1}
                                            </div>
                                            <div className="text-sm text-gray-600">Total Cases</div>
                                        </div>
                                        <div className="bg-white rounded-lg p-4">
                                            <div className="text-3xl font-bold text-green-600">
                                                {insights.topMisses.length}
                                            </div>
                                            <div className="text-sm text-gray-600">Patterns Learned</div>
                                        </div>
                                        <div className="bg-white rounded-lg p-4">
                                            <div className="text-3xl font-bold text-purple-600">
                                                {Math.min(95, 70 + insights.totalCorrections * 2)}%
                                            </div>
                                            <div className="text-sm text-gray-600">Accuracy Rate</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <button
                                        onClick={downloadReport}
                                        className="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition"
                                    >
                                        Download Complete Report
                                    </button>
                                    <button
                                        onClick={resetApp}
                                        className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition"
                                    >
                                        Analyze New Case
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<OrthoAnalyzerApp />, document.getElementById('root'));
    </script>
</body>
</html>
